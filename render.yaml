# Public hobby DEMO ONLY. The filesystem is ephemeral on the free plan.
services:
  - type: web
    name: datamendry-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn datamendry.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATAMENDRY_MAX_UPLOAD_MB
        value: "20"
      - key: DATAMENDRY_DATA_DIR
        value: /tmp/datamendry-data
      - key: DATAMENDRY_TTL_HOURS
        value: "1"
