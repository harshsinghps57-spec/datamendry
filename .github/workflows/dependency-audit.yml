name: Dependency audit
on:
  push:
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime requirements
        run: python -m pip_audit -r requirements.txt
