# Controlled public beta: CSV uploads remain available with guest session isolation.
# The filesystem is ephemeral on the free plan; accept non-sensitive test files only.
services:
  - type: web
    name: datamendry-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn datamendry.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATAMENDRY_DEMO_ONLY
        value: "0"
      - key: DATAMENDRY_SECURE_COOKIE
        value: "1"
      - key: DATAMENDRY_MAX_PER_GUEST
        value: "3"
      - key: DATAMENDRY_UPLOADS_PER_MINUTE
        value: "8"
      - key: DATAMENDRY_MAX_UPLOAD_MB
        value: "8"
      - key: DATAMENDRY_MAX_ROWS
        value: "100000"
      - key: DATAMENDRY_MAX_DB_MB
        value: "64"
      - key: DATAMENDRY_MAX_DATASETS
        value: "12"
      - key: DATAMENDRY_DATA_DIR
        value: /tmp/datamendry-data
      - key: DATAMENDRY_TTL_HOURS
        value: "1"
